<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="100%" height="100%" style="background:#ffffff; font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif;">
  <style>
    .title { font-size: 18px; font-weight: bold; fill: #1e293b; }
    .axis-label { font-size: 12px; fill: #64748b; font-weight: 500; }
    .cat-label { font-size: 11px; fill: #334155; }
    .grid { stroke: #e2e8f0; stroke-dasharray: 3,3; }
    .bar:hover { opacity: 0.85; }
  </style>
  <text x="450.0" y="30" text-anchor="middle" class="title">ML Speedup by Program Size (geometric mean, > 1.0x = faster)</text>
  <line x1="80" y1="60.0" x2="740" y2="60.0" class="grid" />
  <text x="70" y="64.0" text-anchor="end" class="axis-label">1.70</text>
  <line x1="80" y1="130.0" x2="740" y2="130.0" class="grid" />
  <text x="70" y="134.0" text-anchor="end" class="axis-label">1.36</text>
  <line x1="80" y1="200.0" x2="740" y2="200.0" class="grid" />
  <text x="70" y="204.0" text-anchor="end" class="axis-label">1.02</text>
  <line x1="80" y1="270.0" x2="740" y2="270.0" class="grid" />
  <text x="70" y="274.0" text-anchor="end" class="axis-label">0.68</text>
  <line x1="80" y1="340.0" x2="740" y2="340.0" class="grid" />
  <text x="70" y="344.0" text-anchor="end" class="axis-label">0.34</text>
  <line x1="80" y1="410.0" x2="740" y2="410.0" class="grid" />
  <text x="70" y="414.0" text-anchor="end" class="axis-label">0.00</text>
  <text transform="rotate(-90)" x="-235.0" y="25" text-anchor="middle" class="axis-label">Geomean Speedup (x) [Higher is Better]</text>
  <line x1="80" y1="410" x2="740" y2="410" stroke="#94a3b8" stroke-width="1.5" />
  <text transform="rotate(-35 190.0 425)" x="190.0" y="425" text-anchor="end" class="cat-label">Small (<= 92) n=10</text>
  <rect x="113.0" y="219.1" width="46.2" height="190.9" fill="#6366f1" rx="2" class="bar"><title>ML vs -O2 Speedup on Small (<= 92) n=10: 0.926</title></rect>
  <rect x="164.3" y="238.9" width="46.2" height="171.1" fill="#ec4899" rx="2" class="bar"><title>ML vs -O3 Speedup on Small (<= 92) n=10: 0.830</title></rect>
  <rect x="215.7" y="196.8" width="46.2" height="213.2" fill="#94a3b8" rx="2" class="bar"><title>Best candidate vs -O2 on Small (<= 92) n=10: 1.034</title></rect>
  <text transform="rotate(-35 410.0 425)" x="410.0" y="425" text-anchor="end" class="cat-label">Medium (92-129] n=10</text>
  <rect x="333.0" y="148.5" width="46.2" height="261.5" fill="#6366f1" rx="2" class="bar"><title>ML vs -O2 Speedup on Medium (92-129] n=10: 1.268</title></rect>
  <rect x="384.3" y="155.6" width="46.2" height="254.4" fill="#ec4899" rx="2" class="bar"><title>ML vs -O3 Speedup on Medium (92-129] n=10: 1.234</title></rect>
  <rect x="435.7" y="105.7" width="46.2" height="304.3" fill="#94a3b8" rx="2" class="bar"><title>Best candidate vs -O2 on Medium (92-129] n=10: 1.476</title></rect>
  <text transform="rotate(-35 630.0 425)" x="630.0" y="425" text-anchor="end" class="cat-label">Large (> 129) n=10</text>
  <rect x="553.0" y="153.5" width="46.2" height="256.5" fill="#6366f1" rx="2" class="bar"><title>ML vs -O2 Speedup on Large (> 129) n=10: 1.244</title></rect>
  <rect x="604.3" y="161.9" width="46.2" height="248.1" fill="#ec4899" rx="2" class="bar"><title>ML vs -O3 Speedup on Large (> 129) n=10: 1.203</title></rect>
  <rect x="655.7" y="108.7" width="46.2" height="301.3" fill="#94a3b8" rx="2" class="bar"><title>Best candidate vs -O2 on Large (> 129) n=10: 1.461</title></rect>
  <rect x="760" y="70" width="14" height="14" fill="#6366f1" rx="3" />
  <text x="782" y="81" class="axis-label" fill="#1e293b">ML vs -O2 Speedup</text>
  <rect x="760" y="94" width="14" height="14" fill="#ec4899" rx="3" />
  <text x="782" y="105" class="axis-label" fill="#1e293b">ML vs -O3 Speedup</text>
  <rect x="760" y="118" width="14" height="14" fill="#94a3b8" rx="3" />
  <text x="782" y="129" class="axis-label" fill="#1e293b">Best candidate vs -O2</text>
</svg>